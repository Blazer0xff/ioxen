[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioxen"
version = "0.1.0"
description = "iOS runtime interception for mapping XPC/NSXPC, URL scheme and other IPC communication and attack-surface behavior."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "frankheat" }
]
dependencies = [
    "rich>=13",
    "tabulate>=0.9",
    "textual>=0.80",
]

[project.scripts]
ioxen = "ioxen.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ioxen = [
    "ioxen.tcss",
    "runtime/agent/*.js",
    "runtime/config/*.json",
]
